services:
  - type: web
    name: propertyhub-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free # or standard
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: propertyhub-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      # You need to manually add these in the Render Dashboard after deployment:
      # - STRIPE_SECRET_KEY
      # - FRONTEND_URL
      # - CLOUDINARY_CLOUD_NAME
      # - CLOUDINARY_API_KEY
      # - CLOUDINARY_API_SECRET

databases:
  - name: propertyhub-db
    databaseName: propertyhub_db
    user: propertyhub_user
    plan: free # or standard
