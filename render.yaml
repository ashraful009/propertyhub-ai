services:
  - type: web
    name: propertyhub-backend
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migrate:up && npm start
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: propertyhub-db
          property: connectionString
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: propertyhub-db
    databaseName: propertyhub_db
    user: propertyhub_user
    plan: free
